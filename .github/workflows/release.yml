name: Release

# Tags are what mark a release here, so a tag is what builds the image. Pushing to main
# does not: main moves several times between releases and none of those are worth an image.
on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  # Lowercase already, which the registry requires - a mixed-case owner would need folding.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # What lets GITHUB_TOKEN push to ghcr.io, so no registry secret has to be stored.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The version is read out of Directory.Build.props by the build, and the tag is what
      # the image will be named after. Nothing keeps them honest, and when they drift the
      # image is published under a number the UI does not report - which has happened here
      # before, in the other direction, when the props file was missing from the build
      # context entirely and every image claimed 1.0.0.
      - name: Check the tag matches the version in the tree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)

          echo "tag=$tag  Directory.Build.props=$version"

          if [ -z "$version" ]; then
            echo "::error::No <Version> found in Directory.Build.props"
            exit 1
          fi

          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version>"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.11, 1.2 and latest. The floating minor tag is what lets a deployment follow
      # patches without following a new minor, and latest is what a compose file that
      # names no version gets.
      #
      # latest=auto rather than always: it leaves latest where it is for a prerelease, so
      # tagging a v2.0.0-rc1 to try something does not hand it to everyone pulling latest.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keeps the NuGet restore layer between releases; without it every tag pays for a
          # full restore of a dependency set that rarely changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
