<?xml version="1.0" encoding="utf-8"?>
<!--
    A playlist pulled down as a file, which is the whole of what Smurfm3u does.

    Drawn for 16px first, because that is where a favicon actually lives: two bars and a
    solid arrow survive being drawn six pixels tall, where a play triangle would have said
    "media player" and nothing more. The strokes are deliberately heavier than they want to
    be at 128px so that they still read in a browser tab.

    The accent is the dark theme's, fixed rather than following the theme: a tab strip is
    not ours to match, and the tile has to sit on both light and dark browser chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Smurfm3u">
    <rect width="64" height="64" rx="14" fill="#4c8dff"/>

    <!--
        The playlist: two entries, the second short so the pair reads as a list rather than a
        bar chart. The gap between them is wider than it looks like it needs to be, because a
        quarter of it is what survives at 16px - closer together they rasterise into one grey
        smudge rather than two lines.
    -->
    <rect x="14" y="10" width="36" height="6" rx="3" fill="#fff"/>
    <rect x="14" y="22" width="24" height="6" rx="3" fill="#fff"/>

    <!--
        The download, drawn heavier than the bars so it still resolves as an arrow when it is
        four pixels across. The shaft starts clear of the second bar: round caps add half the
        stroke width at each end, so the gap that separates them once drawn is smaller than
        the coordinates suggest.
    -->
    <path d="M32 34 v16 M23 41 l9 9 9-9"
          stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
