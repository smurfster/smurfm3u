services:
  smurfm3udb:
    image: postgres:17-alpine
    container_name: smurfm3u-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smurfm3u
      POSTGRES_USER: smurfm3u
      # Change this, or point it at a secret, before exposing anything.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smurfm3u}
    volumes:
      - smurfm3u-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smurfm3u -d smurfm3u"]
      interval: 10s
      timeout: 5s
      retries: 5

  smurfm3uapp:
    # Published by the release workflow on every version tag. Pin a version here, or with
    # SMURFM3U_TAG in .env, to stop a pull moving you to a release you have not read about:
    # latest follows whatever was tagged last.
    #
    # Building from source is in docker-compose.override.yml, which Compose loads on its own
    # when it is beside this file. It is not merged in here because a build section wins over
    # any pull policy, so this file carrying one would mean nobody could ever pull.
    image: ghcr.io/smurfster/smurfm3u:${SMURFM3U_TAG:-latest}
    container_name: smurfm3u
    restart: unless-stopped
    depends_on:
      smurfm3udb:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=smurfm3udb;Port=5432;Database=smurfm3u;Username=smurfm3u;Password=${POSTGRES_PASSWORD:-smurfm3u}"
      # Leave these unset to have a password and API key generated and written to the log
      # on first run. Once the database exists they are ignored.
      Bootstrap__AdminUsername: ${ADMIN_USERNAME:-admin}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:-}
      Bootstrap__ApiKey: ${API_KEY:-}
      TZ: ${TZ:-Etc/UTC}
      # Permissions on what lands in /downloads. The default leaves finished downloads
      # writable by Sonarr and Radarr, which run as a different user and have to move them.
      UMASK: ${UMASK:-000}
    ports:
      - "${HTTP_PORT:-8090}:8080"
    volumes:
      # Only the host side is configurable; the container paths are what the app is
      # configured with and what it reports to Sonarr and Radarr.
      # Sonarr and Radarr must see the completed downloads at the same path they do here,
      # or you will need a remote path mapping in those apps.
      - ${DOWNLOADS_PATH:-./data/downloads}:/downloads
      # Data protection keys, so a rebuild does not sign everyone out.
      - smurfm3uapp-config:/config
      # Uncomment to add local .m3u files as a playlist source, and point
      # PLAYLISTS_PATH at the directory holding them.
      # - ${PLAYLISTS_PATH:-./data/playlists}:/playlists

volumes:
  smurfm3u-db-data:
    name: smurfm3u-db-data
  smurfm3uapp-config:
    name: smurfm3uapp-config
